<title>ケアプラン文例集 1000</title>
<style>
  :root{ --ink:#1f2933; --muted:#6b7a88; --line:#e3e8ee; --accent:#b9482a; }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:32px 20px 72px;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;

  ul,ol{ padding-left:1.3em; }
  .meta{ color:var(--muted); font-size:14px; margin:0 0 28px; }
  .lead{ background:#fbefea; border-left:3px solid var(--accent); padding:14px 16px; border-radius:0 6px 6px 0; }
  footer{ margin-top:44px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
  a{ color:var(--accent); }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8edf2; --muted:#9aa9b7; --line:#2c3540; --accent:#ee9a7c; }
    body{ background:#151b21; }
    .lead{ background:#261a16; }
  }
</style>
</head>
